<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell narrow"><header><div class="logo">BD</div><div><h1>Account Dashboard</h1><p>UID ও Level ম্যানেজমেন্ট</p></div></header><section class="panel"><h2>Admin Login</h2><form method="post"><label>Admin Password</label><input type="password" name="password" required autocomplete="current-password"><button class="primary full">লগইন</button></form></section>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{category}}">{{message}}</div>{% endfor %}<p class="hint">প্রথমবার চালুর আগে Render Environment-এ ADMIN_PASSWORD সেট করুন।</p></main></body></html>
